# Use Docker's internal DNS resolver with a short TTL so nginx re-resolves the
# 'web' container IP after every restart/recreate (avoids stale upstream).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    listen 8000;
    server_name meetingbox.local localhost _;

    client_max_body_size 500M;
    root /usr/share/nginx/html;

    # API routes -> FastAPI backend (variable proxy_pass forces DNS re-resolution)
    location /api/ {
        set $api_backend http://web:8000;
        proxy_pass $api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # upload-audio can run Anthropic transcription + summary before the response completes
        proxy_connect_timeout 120s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    location /health {
        set $api_backend http://web:8000;
        proxy_pass $api_backend;
    }

    # WebSocket -> FastAPI backend
    location /ws {
        set $ws_backend http://web:8000;
        proxy_pass $ws_backend/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Static files + SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
