# Use Docker's internal DNS resolver with a short TTL so nginx re-resolves the
# 'web' container IP after every restart/recreate (avoids stale upstream).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    listen 8000;
    server_name meetingbox.local localhost _;

    client_max_body_size 2G;
    root /usr/share/nginx/html;

    # API routes -> FastAPI backend (variable proxy_pass forces DNS re-resolution)
    location /api/ {
        set $api_backend http://web:8000;
        proxy_pass $api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # upload-audio can run Anthropic transcription + summary before the response completes
        proxy_connect_timeout 120s;
        proxy_send_timeout 7200s;
        proxy_read_timeout 7200s;
    }

    location /health {
        set $api_backend http://web:8000;
        proxy_pass $api_backend;
    }

    # WebSocket -> FastAPI backend
    location /ws {
        set $ws_backend http://web:8000;
        proxy_pass $ws_backend/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Hashed build assets (filenames change on every build) — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html / SPA shell — never cache, so clients always load the latest
    # build and reference the current hashed asset bundles (prevents the
    # "old page on one refresh, new page on the next" flip from a stale index.html).
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires off;
    }

    # Static files + SPA fallback
    location / {
        add_header Cache-Control "no-store, must-revalidate";
        expires off;
        try_files $uri $uri/ /index.html;
    }
}
