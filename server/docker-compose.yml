# meetingbox-server (split-repo bundle) — cloud / VPS: Redis + FastAPI + nginx.
# Intentionally not a line-for-line rename of legacy web-stack; paths use ./web and DATA_ROOT/FRONTEND_DIST.
# MeetingBox — cloud / VPS stack: Redis + FastAPI + nginx.
# Mini PC runs `mini-pc/` only.
#
# Standalone server repo (this folder is repo root): copy `.env.example` → `.env`
#   defaults FRONTEND_DIST=./frontend/dist and DATA_ROOT=./data
#
# Full monorepo (frontend lives next to server/): in `server/.env` set:
#   FRONTEND_DIST=../frontend/dist
#   DATA_ROOT=../data
#
# Quick start:
#   cd server
#   cp .env.example .env
#   cd frontend && npm ci && npm run build && cd ..
#   docker compose up -d --build

name: meetingbox-server

services:
  redis:
    image: redis:7-alpine
    container_name: meetingbox-redis
    restart: unless-stopped
    ports:
      - ${REDIS_PORT_MAPPING:-127.0.0.1:6379:6379}
    volumes:
      - server-redis-data:/data
    networks:
      - meetingbox-server-net

  web:
    build:
      context: ./web
    container_name: meetingbox-web
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-6}
      - MEETINGBOX_I_ACKNOWLEDGE_MULTI_WORKER_RECORDING=${MEETINGBOX_I_ACKNOWLEDGE_MULTI_WORKER_RECORDING:-1}
      - REDIS_HOST=redis
      - MEETINGBOX_REBOOT_HELPER=/usr/local/bin/meetingbox-host-reboot
      - MEETINGBOX_POWEROFF_HELPER=/usr/local/bin/meetingbox-host-poweroff
      - MEETINGBOX_DB_PATH=/data/transcripts/meetings.db
      - RECORDINGS_DIR=/data/audio/recordings
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_ROUTER_MODEL=${OPENAI_ROUTER_MODEL:-}
      - MEM0_API_KEY=${MEM0_API_KEY:-}
      - OPENAI_TRANSCRIBE_MODEL=${OPENAI_TRANSCRIBE_MODEL:-whisper-1}
      - OPENAI_TTS_VOICE=${OPENAI_TTS_VOICE:-shimmer}
      - OPENAI_TTS_MODEL=${OPENAI_TTS_MODEL:-tts-1}
      # Realtime voice: enable in server .env — device uses OpenAI WebSocket + /api/voice/tool invoke
      - MEETINGBOX_REALTIME_VOICE_ENABLED=${MEETINGBOX_REALTIME_VOICE_ENABLED:-1}
      - OPENAI_REALTIME_MODEL=${OPENAI_REALTIME_MODEL:-gpt-realtime-2}
      # Mem0 ingest: keep calendar + Gmail in Mem0 so voice assistant can recall them
      - MEETINGBOX_MEM0_INGEST_CALENDAR=${MEETINGBOX_MEM0_INGEST_CALENDAR:-1}
      - MEETINGBOX_MEM0_INGEST_GMAIL=${MEETINGBOX_MEM0_INGEST_GMAIL:-1}
      - MEETINGBOX_MEM0_INGEST_CHAT=${MEETINGBOX_MEM0_INGEST_CHAT:-}
      - AI_MODEL=${AI_MODEL:-claude-sonnet-4-20250514}
      - AI_REPORT_MAX_TOKENS=${AI_REPORT_MAX_TOKENS:-16384}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8000}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-}
      - OAUTH_PUBLIC_BASE_URL=${OAUTH_PUBLIC_BASE_URL:-}
    volumes:
      - ${DATA_ROOT:-./data}/transcripts:/data/transcripts
      - ${DATA_ROOT:-./data}/audio:/data/audio
      - ${DATA_ROOT:-./data}/config:/data/config
      - ${FRONTEND_DIST:-./frontend/dist}:/app/static
      - ./scripts/host_reboot.sh:/usr/local/bin/meetingbox-host-reboot:ro
      - ./scripts/host_poweroff.sh:/usr/local/bin/meetingbox-host-poweroff:ro
    networks:
      - meetingbox-server-net

  nginx:
    image: nginx:alpine
    container_name: meetingbox-nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_ALT_PORT:-8000}:8000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${FRONTEND_DIST:-./frontend/dist}:/usr/share/nginx/html:ro
    networks:
      - meetingbox-server-net

volumes:
  server-redis-data:

networks:
  meetingbox-server-net:
    driver: bridge
