# Example: serve MeetingBox SPA from dist/ on the same host as the API.
# Copy into nginx sites-available and set root to your absolute dist/ path.

server {
    listen 80;
    server_name _;

    # MUST be the dist/ folder produced by npm run build — not the repo root.
    root /home/ubuntu/meetingbox-frontend-release/dist;
    index index.html;

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location ^~ /icons/ {
        try_files $uri =404;
    }

    location = /deploy-check.txt {
        try_files $uri =404;
    }

    # Avoid directory-index 403 at "/" by serving the SPA entry explicitly.
    location = / {
        try_files /index.html =404;
    }

    location = /favicon.ico {
        try_files /favicon.ico /icons/ic-logo.svg =204;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        try_files $uri /index.html;
    }
}
