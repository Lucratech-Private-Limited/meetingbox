# What runs on the cloud/server (after `git pull` from repo root).
# Does NOT run: device-ui, Docker audio, mini PC recorder — those stay on the appliance.
#
# Stack: redis + FastAPI (web) + nginx → ports 80 / 8000
#
# Quick start (repo root):
#   cp .env.server.example .env
#   nano .env   # JWT_SECRET_KEY, APP_BASE_URL, FRONTEND_BASE_URL, API keys
#   cd frontend && npm ci && npm run build && cd ..
#   docker compose -f docker-compose.server.yml up -d --build
#
# Mini PC audio must reach this Redis + UPLOAD_AUDIO_API_URL (see deploy/README-SERVER.md).

name: meetingbox-server

services:
  redis:
    image: redis:7-alpine
    container_name: meetingbox-redis
    restart: unless-stopped
    ports:
      - ${REDIS_PORT_MAPPING:-127.0.0.1:6379:6379}
    volumes:
      - server-redis-data:/data
    networks:
      - meetingbox-server-net

  web:
    build:
      context: ./services/web
    container_name: meetingbox-web
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - MEETINGBOX_REBOOT_HELPER=/usr/local/bin/meetingbox-host-reboot
      - MEETINGBOX_POWEROFF_HELPER=/usr/local/bin/meetingbox-host-poweroff
      - MEETINGBOX_DB_PATH=/data/transcripts/meetings.db
      - RECORDINGS_DIR=/data/audio/recordings
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_TRANSCRIBE_MODEL=${OPENAI_TRANSCRIBE_MODEL:-whisper-1}
      - AI_MODEL=${AI_MODEL:-claude-sonnet-4-20250514}
      - AI_REPORT_MAX_TOKENS=${AI_REPORT_MAX_TOKENS:-16384}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8000}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-}
    volumes:
      - ./data/transcripts:/data/transcripts
      - ./data/audio:/data/audio
      - ./data/config:/data/config
      - ./frontend/dist:/app/static
      - ./scripts/host_reboot.sh:/usr/local/bin/meetingbox-host-reboot:ro
      - ./scripts/host_poweroff.sh:/usr/local/bin/meetingbox-host-poweroff:ro
    networks:
      - meetingbox-server-net

  nginx:
    image: nginx:alpine
    container_name: meetingbox-nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_ALT_PORT:-8000}:8000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    networks:
      - meetingbox-server-net

volumes:
  server-redis-data:

networks:
  meetingbox-server-net:
    driver: bridge
