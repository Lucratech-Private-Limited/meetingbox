# =============================================================================
# MeetingBox — root docker-compose.yml (full dev / appliance on one machine)
# =============================================================================
# **Cloud VPS only:** use `server/docker-compose.yml` (see `server/README.md`).
#
# This file mixes `server/` + `mini-pc/` for local all-in-one testing.
# Set `COMPOSE_PROFILES` in repo-root `.env` (see .env.example).
#
# Appliance: `mini-pc/audio/run_audio_capture.sh`, `mini-pc/device-ui/run_device_ui.sh`.
# =============================================================================

services:
  redis:
    image: redis:7-alpine
    container_name: meetingbox-redis
    restart: unless-stopped
    profiles: ["backend", "docker-audio"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - meetingbox-net

  web:
    build:
      context: ./server/web
    container_name: meetingbox-web
    restart: unless-stopped
    profiles: ["backend"]
    depends_on:
      redis:
        condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - MEETINGBOX_REBOOT_HELPER=/usr/local/bin/meetingbox-host-reboot
      - MEETINGBOX_POWEROFF_HELPER=/usr/local/bin/meetingbox-host-poweroff
      - MEETINGBOX_DB_PATH=/data/transcripts/meetings.db
      - RECORDINGS_DIR=/data/audio/recordings
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_TRANSCRIBE_MODEL=${OPENAI_TRANSCRIBE_MODEL:-whisper-1}
      - AI_MODEL=${AI_MODEL:-claude-sonnet-4-20250514}
      - AI_REPORT_MAX_TOKENS=${AI_REPORT_MAX_TOKENS:-16384}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8000}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-}
      - OAUTH_PUBLIC_BASE_URL=${OAUTH_PUBLIC_BASE_URL:-}
    volumes:
      - ./data/transcripts:/data/transcripts
      - ./data/audio:/data/audio
      - ./data/config:/data/config
      - ./frontend/dist:/app/static
      - ./server/scripts/host_reboot.sh:/usr/local/bin/meetingbox-host-reboot:ro
      - ./server/scripts/host_poweroff.sh:/usr/local/bin/meetingbox-host-poweroff:ro
    networks:
      - meetingbox-net

  nginx:
    image: nginx:alpine
    container_name: meetingbox-nginx
    restart: unless-stopped
    profiles: ["frontend"]
    depends_on:
      - web
    ports:
      - "80:80"
      - "8000:8000"
    volumes:
      - ./server/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    networks:
      - meetingbox-net

  audio:
    build:
      context: ./mini-pc/audio
    container_name: meetingbox-audio
    restart: unless-stopped
    profiles: ["docker-audio"]
    depends_on:
      redis:
        condition: service_started
    user: "1000:1000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - RECORDINGS_DIR=/data/audio/recordings
      - TEMP_SEGMENTS_DIR=/data/audio/temp
      - AUDIO_INPUT_DEVICE_INDEX=${AUDIO_INPUT_DEVICE_INDEX:-}
      - AUDIO_INPUT_DEVICE_NAME=${AUDIO_INPUT_DEVICE_NAME:-}
      - UPLOAD_AUDIO_ON_STOP=${UPLOAD_AUDIO_ON_STOP:-1}
      - UPLOAD_AUDIO_API_URL=${UPLOAD_AUDIO_API_URL:-http://host.docker.internal:8000/api/meetings/upload-audio}
      - UPLOAD_AUDIO_TIMEOUT_SECONDS=${UPLOAD_AUDIO_TIMEOUT_SECONDS:-1200}
      - DEVICE_AUTH_TOKEN=${DEVICE_AUTH_TOKEN:-}
    volumes:
      - ./data/audio:/data/audio
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    networks:
      - meetingbox-net

  device-ui:
    build:
      context: ./mini-pc/device-ui
    container_name: meetingbox-ui
    user: "1000:1000"
    restart: unless-stopped
    profiles: ["mini-pc", "screen"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1
      - BACKEND_URL=${BACKEND_URL:-http://host.docker.internal:8000}
      - BACKEND_WS_URL=${BACKEND_WS_URL:-}
      - DASHBOARD_URL=${DASHBOARD_URL:-}
      - DISPLAY=${DISPLAY:-:0}
      - KIVY_WINDOW=sdl2
      - KIVY_NO_CONSOLELOG=1
      - FULLSCREEN=${FULLSCREEN:-0}
      - MOCK_BACKEND=${MOCK_BACKEND:-0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./data/config:/data/config
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "44"
      - "109"
    networks:
      - meetingbox-net

volumes:
  redis-data:

networks:
  meetingbox-net:
    driver: bridge
