  #     - meetingbox-net

  # ollama:
  #   profiles:
  #     - local-workers
  #   build:
  #     context: ./services/ollama
  #   container_name: meetingbox-ollama
  #   restart: unless-stopped
  #   environment:
  #     - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-phi3:mini}
  #   volumes:
  #     - ollama-data:/root/.ollama
  #   healthcheck:
  #     test: ["CMD", "ollama", "list"]
