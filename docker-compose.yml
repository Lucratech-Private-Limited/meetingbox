services:
  redis:
    image: redis:7-alpine
    container_name: meetingbox-redis
    restart: unless-stopped
    # Localhost only: native `services/audio/run_audio_capture.sh` uses REDIS_HOST=127.0.0.1.
    # Remove this mapping if you run another Redis on the host on 6379.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - meetingbox-net

  # Default stack (`docker compose up -d`): redis, web, nginx — cloud transcription (OpenAI)
  # + summarization (Anthropic) inside web. Optional profiles:
  #   docker-audio      → container mic capture + upload to web
  #   screen            → Kivy device-ui
  #   local-workers     → legacy local Whisper + Ollama + ai worker (not needed for API-only)

  # ================================================================
  # Audio capture in Docker (optional — not recommended on mini-PC)
  # ================================================================
  # Default stack uses **host** capture: run from repo:
  #   services/audio/run_audio_capture.sh
  # To use the containerized capture instead:
  #   docker compose --profile docker-audio up -d
  # ================================================================
  audio:
    build:
      context: ./services/audio
    container_name: meetingbox-audio
    restart: unless-stopped
    depends_on:
      - redis
    user: "1000:1000"            # Run as host meetingbox user so data volume writes succeed
    environment:
      - PYTHONUNBUFFERED=1
      - AUDIO_INPUT_DEVICE_INDEX=${AUDIO_INPUT_DEVICE_INDEX:-}
      - AUDIO_INPUT_DEVICE_NAME=${AUDIO_INPUT_DEVICE_NAME:-}
      - UPLOAD_AUDIO_ON_STOP=${UPLOAD_AUDIO_ON_STOP:-1}
      - UPLOAD_AUDIO_API_URL=${UPLOAD_AUDIO_API_URL:-http://web:8000/api/meetings/upload-audio}
      - UPLOAD_AUDIO_TIMEOUT_SECONDS=${UPLOAD_AUDIO_TIMEOUT_SECONDS:-1200}
    volumes:
      - ./data/audio:/data/audio
    devices:
      - /dev/snd:/dev/snd       # Pass ALSA devices into the container (Linux only)
    group_add:
      - audio                    # Add container to host audio group (Linux only)
    networks:
      - meetingbox-net

