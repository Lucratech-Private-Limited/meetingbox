  web:
    build:
      context: ./services/web
    container_name: meetingbox-web
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_TRANSCRIBE_MODEL=${OPENAI_TRANSCRIBE_MODEL:-whisper-1}
      - AI_MODEL=${AI_MODEL:-claude-sonnet-4-20250514}
      - AI_REPORT_MAX_TOKENS=${AI_REPORT_MAX_TOKENS:-16384}
      - USE_LOCAL_LLM=${USE_LOCAL_LLM:-false}
      - OLLAMA_HOST=http://ollama:11434
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-phi3:mini}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8000}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-}
    volumes:
      - ./data/transcripts:/data/transcripts
      - ./data/audio:/data/audio
      - ./data/config:/data/config
      - ./frontend/dist:/app/static
    networks:
      - meetingbox-net

  nginx:
    image: nginx:alpine
    container_name: meetingbox-nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "8000:8000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    networks:
      - meetingbox-net

  # ================================================================
  # Device UI — Kivy appliance interface
  # ================================================================
  # Renders directly to the attached display via X11 passthrough.
  # Requires: X server running on the host (startx / lightdm).
  #
  # DEV MODE: profiles: ["screen"] means this container does NOT
  # auto-start with 'docker compose up'. To start it manually:
  #   docker compose --profile screen up -d device-ui
  # Remove the profiles line for production.
  # ================================================================



  # device-ui:
  #   build:
  #     context: ./device-ui
  #   container_name: meetingbox-ui
  #   # Match web/audio/transcription (UID 1000) so ./data/config is writable.
  #   user: "1000:1000"
  #   restart: unless-stopped
  #   depends_on:
  #     - web
  #     - redis
  #   environment:
  #     - PYTHONUNBUFFERED=1
