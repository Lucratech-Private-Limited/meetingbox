# Cloud/server only (git pull on AWS/VPS): docker compose -f docker-compose.server.yml up -d
# Same stack also in web-stack/docker-compose.yml (paths relative to that folder).
services:
  redis:
    image: redis:7-alpine
    container_name: meetingbox-redis
    restart: unless-stopped
    # Localhost only: native `services/audio/run_audio_capture.sh` uses REDIS_HOST=127.0.0.1.
    # Remove this mapping if you run another Redis on the host on 6379.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - meetingbox-net

  # Default stack: redis, web, nginx — OpenAI (Whisper) + Anthropic (Claude) inside web.
  # Optional: --profile docker-audio for container mic capture.

  # ================================================================
  # Audio capture in Docker (optional — not recommended on mini-PC)
  # ================================================================
  # Default stack uses **host** capture: run from repo:
  #   services/audio/run_audio_capture.sh
  # To use the containerized capture instead:
  #   docker compose --profile docker-audio up -d
  # ================================================================
  audio:
    build:
      context: ./services/audio
    container_name: meetingbox-audio
    restart: unless-stopped
    depends_on:
      - redis
    user: "1000:1000"            # Run as host meetingbox user so data volume writes succeed
    # Reach FastAPI on the host or on published port 8000 (host uvicorn / nginx → web).
    # Inside a container, http://web:8000 only works when meetingbox-web is running in Compose.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - RECORDINGS_DIR=/data/audio/recordings
      - TEMP_SEGMENTS_DIR=/data/audio/temp
      - AUDIO_INPUT_DEVICE_INDEX=${AUDIO_INPUT_DEVICE_INDEX:-}
      - AUDIO_INPUT_DEVICE_NAME=${AUDIO_INPUT_DEVICE_NAME:-}
      - UPLOAD_AUDIO_ON_STOP=${UPLOAD_AUDIO_ON_STOP:-1}
      - UPLOAD_AUDIO_API_URL=${UPLOAD_AUDIO_API_URL:-http://host.docker.internal:8000/api/meetings/upload-audio}
      - UPLOAD_AUDIO_TIMEOUT_SECONDS=${UPLOAD_AUDIO_TIMEOUT_SECONDS:-1200}
      - DEVICE_AUTH_TOKEN=${DEVICE_AUTH_TOKEN:-}
    volumes:
      - ./data/audio:/data/audio
    devices:
      - /dev/snd:/dev/snd       # Pass ALSA devices into the container (Linux only)
    group_add:
      - audio                    # Add container to host audio group (Linux only)
    networks:
      - meetingbox-net

  web:
    build:
      context: ./services/web
    container_name: meetingbox-web
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - MEETINGBOX_REBOOT_HELPER=/usr/local/bin/meetingbox-host-reboot
      - MEETINGBOX_POWEROFF_HELPER=/usr/local/bin/meetingbox-host-poweroff
      - MEETINGBOX_DB_PATH=/data/transcripts/meetings.db
      - RECORDINGS_DIR=/data/audio/recordings
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_TRANSCRIBE_MODEL=${OPENAI_TRANSCRIBE_MODEL:-whisper-1}
      - AI_MODEL=${AI_MODEL:-claude-sonnet-4-20250514}
      - AI_REPORT_MAX_TOKENS=${AI_REPORT_MAX_TOKENS:-16384}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8000}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-}
    volumes:
      - ./data/transcripts:/data/transcripts
      - ./data/audio:/data/audio
      - ./data/config:/data/config
      - ./frontend/dist:/app/static
      - ./scripts/host_reboot.sh:/usr/local/bin/meetingbox-host-reboot:ro
      - ./scripts/host_poweroff.sh:/usr/local/bin/meetingbox-host-poweroff:ro
    networks:
      - meetingbox-net

  nginx:
    image: nginx:alpine
    container_name: meetingbox-nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "8000:8000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    networks:
      - meetingbox-net

  # ================================================================
  # Device UI — Kivy appliance interface
  # ================================================================
  # Renders directly to the attached display via X11 passthrough.
  # Requires: X server running on the host (startx / lightdm).
  #
  # DEV MODE: profiles: ["screen"] means this container does NOT
  # auto-start with 'docker compose up'. To start it manually:
  #   docker compose --profile screen up -d device-ui
  # Remove the profiles line for production.
  # ================================================================



  # device-ui:
  #   build:
  #     context: ./device-ui
  #   container_name: meetingbox-ui
  #   # Match web/audio (UID 1000) so ./data/config is writable.
  #   user: "1000:1000"
  #   restart: unless-stopped
  #   depends_on:
  #     - web
  #     - redis
  #   environment:
  #     - PYTHONUNBUFFERED=1
  #     # Point to the web service inside the Docker network
  #     - BACKEND_URL=http://web:8000
  #     - BACKEND_WS_URL=ws://web:8000/ws
  #     # Display: use the host X server
  #     - DISPLAY=${DISPLAY:-:0}
  #     # Kivy settings
  #     - KIVY_WINDOW=sdl2
  #     - KIVY_NO_CONSOLELOG=1
  #     # Fullscreen mode — set to 1 for dedicated kiosk display,
  #     # 0 for windowed mode on a normal desktop.
  #     - FULLSCREEN=0
  #     - MOCK_BACKEND=0
  #     # GPU rendering: Mesa uses host DRI device (/dev/dri) for hardware
  #     # acceleration. Remove the devices block and uncomment below if
  #     # hardware fails (e.g. black screen):
  #     # - LIBGL_ALWAYS_SOFTWARE=1
  #   volumes:
  #     # X11 socket — lets the container draw on the host display
  #     - /tmp/.X11-unix:/tmp/.X11-unix:rw
  #     # Persistent device config (settings, setup marker)
  #     - ./data/config:/data/config
  #     # No Xauthority mount needed — the host .xinitrc runs
  #     # 'xhost +local:' which allows all local socket connections
  #     # without a magic cookie. Mounting the file caused failures
  #     # when it didn't exist yet at container start time.
  #   devices:
  #     # Pass the GPU into the container so Mesa can use hardware rendering.
  #     # If this path does not exist on the host, remove this block.
  #     - /dev/dri:/dev/dri
  #   group_add:
  #     # Give the container user access to DRI render nodes.
  #     # GID 44  = video group on Ubuntu (card devices)
  #     # GID 109 = render group on Ubuntu 24.04 (renderD* devices)
  #     - "44"
  #     - "109"
  #   networks:
  #     - meetingbox-net
  #   # NOTE: For production with a touchscreen, uncomment:
  #   # devices:
  #   #   - /dev/input:/dev/input

volumes:
  redis-data:

networks:
  meetingbox-net:
    driver: bridge

