# Production overrides for MeetingBox (use with docker-compose.yml on appliance)
#
# Full appliance:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --profile backend --profile frontend --profile screen up -d
#
# Container mic + same host API:
#   ... --profile backend --profile frontend --profile docker-audio --profile screen up -d
#
# `screen` activates device-ui (alias profile `mini-pc`). Transcription/summary use
# OpenAI + Anthropic inside `web`.

services:
  web:
    pid: host
    cap_add:
      - SYS_ADMIN

  device-ui:
    devices:
      - /dev/input:/dev/input
