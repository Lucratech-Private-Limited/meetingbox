# Production overrides for MeetingBox
#
# Audio: either host script (services/audio/run_audio_capture.sh) or Docker:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile docker-audio --profile screen up -d
#
# Default stack has no local Ollama/Whisper workers (--profile local-workers to enable).
#
# Usage (systemd service applies this automatically):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile screen up -d
#
# NOTE: profiles: [] does NOT clear the "screen" profile from the base file.
# The --profile screen flag in the systemd ExecStart command is what activates
# device-ui in production. This file adds device passthrough only.
# /dev/dri is intentionally omitted for portability; some Pi images/devices
# do not expose it, and Docker fails hard if a configured device path is missing.
#
# Appliance-only: host reboot from Settings requires host PID ns + privileges.
# Do NOT add this to default compose — it can prevent `web` from starting (nginx 502).

services:
  web:
    pid: host
    cap_add:
      - SYS_ADMIN

  device-ui:
    devices:
      - /dev/input:/dev/input
